name: Site · GitHub Pages

# Publica o site (apps/site, com o painel embutido) no GitHub Pages a cada mudança na main.
# Sem domínio próprio, o endereço é https://<dono>.github.io/<repositório>/ e o build usa esse caminho
# como base. Com domínio próprio (Settings → Pages → Custom domain), o base vira "/" sozinho.
on:
  push:
    branches: [main]
    paths: ['apps/site/**', 'apps/provider-panel/**', '.github/workflows/pages-site.yml']
  workflow_dispatch:

# Menor privilégio: o build só lê (código e dados do Pages); só o job de publicação escreve no Pages.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build do site
    runs-on: ubuntu-latest
    # O configure-pages consulta a API do Pages (só leitura). Permissão no job troca a do topo,
    # por isso o contents: read aparece de novo aqui.
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # O Astro exige 22.23.4+: sem isto o runner usa o 22.x em cache, que pode ser mais antigo.
          check-latest: true
          cache: npm
          cache-dependency-path: |
            apps/site/package-lock.json
            apps/provider-panel/package-lock.json
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - run: npm ci
      - name: Build (painel embutido + site)
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/site/dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
