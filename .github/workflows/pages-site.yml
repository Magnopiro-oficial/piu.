name: Site · GitHub Pages

# Publica o site (apps/site, com o painel embutido) no GitHub Pages a cada mudança na main.
# Sem domínio próprio, o endereço é https://<dono>.github.io/<repositório>/ e o build usa esse caminho
# como base. Com domínio próprio (Settings → Pages → Custom domain), o base vira "/" sozinho.
on:
  push:
    branches: [main]
    paths: ['apps/site/**', 'apps/provider-panel/**', '.github/workflows/pages-site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build do site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # O Astro exige 22.23.4+: sem isto o runner usa o 22.x em cache, que pode ser mais antigo.
          check-latest: true
          cache: npm
          cache-dependency-path: |
            apps/site/package-lock.json
            apps/provider-panel/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build (painel embutido + site)
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
