name: CI · provider-desktop

on:
  push:
    branches: [main]
    paths: ['apps/provider-desktop/**', 'apps/piu-node/**', 'apps/provider-panel/**', '.github/workflows/ci-provider-desktop.yml']
  pull_request:
    paths: ['apps/provider-desktop/**', 'apps/piu-node/**', 'apps/provider-panel/**', '.github/workflows/ci-provider-desktop.yml']

# Menor privilégio: o token do GitHub só lê o código.
permissions:
  contents: read

concurrency:
  group: ci-provider-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: provider-desktop
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/provider-desktop
    env:
      # O binário do Electron não é necessário para typecheck e bundle.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Dependências (piu-node, painel e desktop)
        run: npm run deps && npm ci
      - name: Auditoria do piu-node embutido (falha em alto/crítico)
        run: npm --prefix ../piu-node audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Painel e processo principal
        run: npm run build:panel && npm run build
