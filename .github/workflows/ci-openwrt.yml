name: CI · pacotes OpenWrt e Linux

on:
  push:
    branches: [main]
    paths: ['packaging/openwrt/**', 'packaging/linux/**', 'apps/piu-node/**', 'apps/provider-panel/**', '.github/workflows/ci-openwrt.yml']
  pull_request:
    paths: ['packaging/openwrt/**', 'packaging/linux/**', 'apps/piu-node/**', 'apps/provider-panel/**', '.github/workflows/ci-openwrt.yml']

# Menor privilégio: o token do GitHub só lê o código.
permissions:
  contents: read

concurrency:
  group: ci-openwrt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipk:
    name: piu-node .ipk (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.19: mínimo das bibliotecas e o Node do OpenWrt 24.10 (20.20); 22: o do OpenWrt 25.12 e do CI.
        node: ['20.19', '22']
    defaults:
      run:
        working-directory: packaging/openwrt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            packaging/openwrt/package-lock.json
            apps/piu-node/package-lock.json
            apps/provider-panel/package-lock.json
      - name: Dependências (piu-node, painel e empacotador)
        run: npm run deps && npm ci
      - name: Auditoria do piu-node empacotado (falha em alto/crítico)
        run: npm --prefix ../../apps/piu-node audit --omit=dev --audit-level=high
      - name: Painel
        run: npm run build:panel
      - name: Gerar o .ipk
        run: npm run build
      - name: Testes do pacote (estrutura, init/UCI e o bundle servindo o painel)
        run: npm test
      # .deb (packaging/linux): o mesmo bundle, unidade systemd e lançador; com o dpkg-deb do runner.
      - name: Gerar e testar o .deb
        working-directory: packaging/linux
        run: npm run build && npm test && dpkg-deb --info dist/*.deb
      - if: matrix.node == '22'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: piu-node-openwrt-ipk
          path: packaging/openwrt/dist/*.ipk
          if-no-files-found: error
          retention-days: 30
      - if: matrix.node == '22'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: piu-node-linux-deb
          path: packaging/linux/dist/*.deb
          if-no-files-found: error
          retention-days: 30
