# Release do Piu Provider para computador (apps/provider-desktop).
# Gera macOS x64 + arm64 (.dmg/.zip), Linux x64 (.AppImage/.deb) e Windows x64 (.exe NSIS),
# SHA256SUMS.txt e, quando disparado por tag `provider-v*`, um GitHub Release em RASCUNHO.
#
# Como disparar
#   - Tag:      git tag provider-v0.1.0 && git push origin provider-v0.1.0
#   - Manual:   Actions → "Release · Piu Provider" → Run workflow → version (ex.: 0.1.0).
#               Sem `tag`, só artefatos do run (30 dias). Com `tag` (já existente no remoto),
#               também cria/atualiza o release em rascunho dessa tag.
#
# Assinatura/notarização desligadas: ver o cabeçalho de release-electron.yml.

name: Release · Piu Provider

on:
  push:
    tags: ['provider-v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Versão (semver, sem prefixo; ex.: 0.1.0)"
        required: true
        type: string
      tag:
        description: "Tag existente para anexar o release em rascunho (ex.: provider-v0.1.0). Vazio = só artefatos"
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-provider-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  params:
    name: Parâmetros
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.p.outputs.version }}
      tag: ${{ steps.p.outputs.tag }}
    steps:
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "push" ]]; then
            tag="$REF_NAME"
            version="${tag#provider-v}"
          else
            tag="$IN_TAG"
            version="$IN_VERSION"
            if [[ -n "$tag" && "$tag" != provider-v* ]]; then
              echo "::error::A tag deve começar com provider-v (recebido: $tag)"; exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "versão=$version tag=${tag:-<nenhuma>}"

  installers:
    name: Instaladores
    needs: params
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-electron.yml
    with:
      app_name: Piu Provider
      app_dir: apps/provider-desktop
      artifact_prefix: piu-provider
      version: ${{ needs.params.outputs.version }}
      tag: ${{ needs.params.outputs.tag }}
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
