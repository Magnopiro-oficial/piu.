name: CI · Painel do provider

on:
  push:
    branches: [main]
    paths: ['apps/provider-panel/**', '.github/workflows/ci-provider-panel.yml']
  pull_request:
    paths: ['apps/provider-panel/**', '.github/workflows/ci-provider-panel.yml']

# Menor privilégio: o token do GitHub só lê o código (nada de escrita no repositório).
permissions:
  contents: read

concurrency:
  group: ci-provider-panel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Painel do provider
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/provider-panel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/provider-panel/package-lock.json
      - run: npm ci
      - name: Auditoria de dependências (falha em alto/crítico)
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck e build
        run: npm run build
