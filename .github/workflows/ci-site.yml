name: CI · Site

on:
  push:
    branches: [main]
    paths: ['apps/site/**', 'apps/provider-panel/**', '.github/workflows/ci-site.yml']
  pull_request:
    paths: ['apps/site/**', 'apps/provider-panel/**', '.github/workflows/ci-site.yml']

concurrency:
  group: ci-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/site/package-lock.json
            apps/provider-panel/package-lock.json
      - run: npm ci
      # O site embute o build do painel, por isso também roda quando apps/provider-panel muda.
      - name: Checagem, build do painel embutido e build do site
        run: npm run build
