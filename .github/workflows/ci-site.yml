name: CI · Site

on:
  push:
    branches: [main]
    paths: ['apps/site/**', 'apps/provider-panel/**', '.github/workflows/ci-site.yml']
  pull_request:
    paths: ['apps/site/**', 'apps/provider-panel/**', '.github/workflows/ci-site.yml']

# Menor privilégio: o token do GitHub só lê o código.
permissions:
  contents: read

concurrency:
  group: ci-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/site/package-lock.json
            apps/provider-panel/package-lock.json
      - run: npm ci
      - name: Auditoria de dependências (falha em alto/crítico)
        run: npm audit --omit=dev --audit-level=high
      # O site embute o build do painel, por isso também roda quando apps/provider-panel muda.
      - name: Checagem, build do painel embutido e build do site
        run: npm run build
