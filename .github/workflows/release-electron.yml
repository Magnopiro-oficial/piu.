# Workflow REUTILIZÁVEL (workflow_call): gera os instaladores de um app Electron do monorepo
# (apps/provider-desktop → "Piu Provider"; apps/desktop → "Piu Desktop") e, quando chamado a
# partir de uma tag, anexa tudo a um GitHub Release em RASCUNHO (o dono revisa e publica).
#
# Quem chama: release-provider-desktop.yml (tags provider-v*) e release-desktop.yml (tags desktop-v*).
#
# Matriz de build
#   macOS Intel (x64)          macos-15-intel   (.dmg + .zip)   ← macos-13 foi aposentado pelo GitHub
#   macOS Apple Silicon (arm64) macos-15         (.dmg + .zip)   ← macos-14 foi aposentado pelo GitHub
#   Linux x64                   ubuntu-latest    (.AppImage + .deb)
#   Windows x64                 windows-latest   (.exe NSIS)
#
# Assinatura de código / notarização: LIGAM SOZINHAS quando os secrets existem (hoje não existem).
#   Quem decide é o electron-builder.signing.cjs de cada app (scripts/electron-signing/index.cjs):
#   sem certificado, macOS sai com assinatura ad-hoc e Windows sem assinatura, como antes.
#   - CSC_IDENTITY_AUTO_DISCOVERY=false impede o electron-builder de procurar um certificado no
#     keychain do runner; com CSC_LINK ele usa um keychain temporário com o .p12, sem procurar.
#   - Secrets OPCIONAIS (vazios = desligado). Cada job só recebe os da sua plataforma:
#       macOS   CSC_LINK / CSC_KEY_PASSWORD                    Developer ID Application (.p12 em base64) e senha
#               APPLE_API_KEY_P8 / APPLE_API_KEY_ID / APPLE_API_ISSUER   notarização por chave da API (preferido)
#               APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID   notarização por Apple ID (alternativa)
#       Windows WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD            certificado Authenticode (.pfx em base64) e senha
#               AZURE_* (Trusted Signing)                      só funciona em runner Windows: ver docs/distribuicao/assinatura.md
#   Passo a passo, compra e conferência: docs/distribuicao/assinatura.md.
#
# Publicação pelo electron-builder: desligada (`--publish never`). Quem cria o release é `gh`.

name: Release · Electron (reutilizável)

on:
  workflow_call:
    inputs:
      app_name:
        description: "Nome do produto (ex.: Piu Provider)"
        required: true
        type: string
      app_dir:
        description: "Pasta do app no monorepo (ex.: apps/provider-desktop)"
        required: true
        type: string
      version:
        description: "Versão semver sem prefixo (ex.: 0.1.0). Vazio = a do package.json"
        required: false
        type: string
        default: ''
      tag:
        description: "Tag do release (ex.: provider-v0.1.0). Vazio = só artefatos, sem release"
        required: false
        type: string
        default: ''
      artifact_prefix:
        description: "Prefixo dos artefatos (ex.: piu-provider)"
        required: true
        type: string
      output_dir:
        description: Pasta de saída do electron-builder (directories.output), relativa ao app
        required: false
        type: string
        default: release
      node_version:
        description: Versão do Node
        required: false
        type: string
        default: '22'
    secrets:
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_API_KEY_P8:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
      WIN_CSC_LINK:
        required: false
      WIN_CSC_KEY_PASSWORD:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_TRUSTED_SIGNING_ENDPOINT:
        required: false
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME:
        required: false
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE:
        required: false
      AZURE_TRUSTED_SIGNING_PUBLISHER_NAME:
        required: false

# Menor privilégio por padrão; só o job `release` escreve (releases).
permissions:
  contents: read

defaults:
  run:
    # Bash em todos os SOs (no Windows é o Git Bash do runner): mesmos scripts, mesmos caminhos.
    shell: bash

jobs:
  build:
    name: ${{ inputs.app_name }} · ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # Só o build do Windows roda em contêiner (vazio = direto no runner).
    container: ${{ matrix.container || '' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-x64
            os: macos-15-intel
            platform: mac
            arch: x64
          - label: macos-arm64
            os: macos-15
            platform: mac
            arch: arm64
          - label: linux-x64
            os: ubuntu-latest
            platform: linux
            arch: x64
          # Windows é gerado no Linux com Wine (imagem oficial do electron-builder): o nome do
          # repositório termina em ponto ("piu.") e o Windows não cria pasta com ponto no fim, então
          # o runner windows-latest nem consegue montar a área de trabalho (D:\a\piu.\piu.).
          - label: windows-x64
            os: ubuntu-latest
            container: electronuserland/builder:wine@sha256:f3a8d451994c881d0972e7b1846ee4d4fdc15eb41fc6b1f350b38cbf99ca90fe
            platform: win
            arch: x64
    env:
      APP_DIR: ${{ inputs.app_dir }}
      # Sem certificado: não procurar identidade no keychain (senão o build do macOS falha).
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Os secrets de assinatura NÃO ficam aqui: só os passos que precisam deles os recebem (env do
      # passo), para que `npm ci` e scripts de instalação de dependências não os enxerguem.
      # Sem telemetria/avisos de update do electron-builder; cache do Electron por runner.
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}

      - name: Versão
        id: ver
        working-directory: ${{ inputs.app_dir }}
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          current="$(node -p "require('./package.json').version")"
          want="${INPUT_VERSION:-$current}"
          if [[ ! "$want" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Versão inválida: '$want' (esperado semver, ex.: 0.1.0)"; exit 1
          fi
          if [[ "$want" != "$current" ]]; then
            echo "package.json em $current; instalador sairá como $want (sem commit)"
            npm version "$want" --no-git-tag-version --allow-same-version
          fi
          echo "version=$want" >> "$GITHUB_OUTPUT"

      - name: "Dependências (deps do app, ex.: piu-node e painel) e npm ci"
        working-directory: ${{ inputs.app_dir }}
        run: |
          set -euo pipefail
          npm run deps --if-present
          npm ci

      - name: Assinatura / notarização (estado)
        env:
          PLATFORM: ${{ matrix.platform }}
          APPLE_API_KEY_P8: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY_P8 || '' }}
          # Secrets opcionais de assinatura/notarização (vazios = desligado), só na plataforma certa:
          # o CSC_LINK (Apple) não pode chegar ao job do Windows, senão o electron-builder tentaria
          # assinar o .exe com ele. APPLE_API_KEY (caminho do .p8) é criado no passo "Assinatura".
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.CSC_LINK || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_API_KEY_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          WIN_CSC_LINK: ${{ matrix.platform == 'win' && secrets.WIN_CSC_LINK || '' }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ matrix.platform == 'win' && secrets.AZURE_TRUSTED_SIGNING_ENDPOINT || '' }}
        run: |
          set -euo pipefail
          # O electron-builder quer APPLE_API_KEY como CAMINHO do .p8; o secret guarda o conteúdo.
          if [[ -n "${APPLE_API_KEY_P8}" ]]; then
            key="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID:-piu}.p8"
            (umask 077; printf '%s\n' "${APPLE_API_KEY_P8}" > "$key")
            echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
          fi
          case "$PLATFORM" in
            mac)
              if [[ -n "${CSC_LINK}" ]]; then
                echo "::notice::macOS: Developer ID presente → assinatura + hardened runtime."
                [[ -n "${APPLE_API_KEY_P8}${APPLE_ID}" ]] || echo "::warning::macOS assinado SEM notarização (faltam APPLE_API_KEY_P8/… ou APPLE_ID/…): o Gatekeeper ainda bloqueia o download."
              else
                echo "::notice::macOS: sem Developer ID (CSC_LINK vazio) → assinatura ad-hoc. Na 1ª abertura: botão direito → Abrir."
              fi ;;
            win)
              if [[ -n "${WIN_CSC_LINK}" ]]; then
                echo "::notice::Windows: certificado .pfx presente → instalador assinado."
              elif [[ -n "${AZURE_TRUSTED_SIGNING_ENDPOINT}" ]]; then
                echo "::warning::Windows: Azure Trusted Signing configurado, mas este job roda no Linux/Wine e o Trusted Signing exige Windows → instalador SEM assinatura. Ver docs/distribuicao/assinatura.md."
              else
                echo "::notice::Windows: sem certificado → instalador sem assinatura (aviso do SmartScreen)."
              fi ;;
            *) echo "::notice::Linux: AppImage/deb não levam assinatura de código." ;;
          esac

      - name: Build + instaladores (${{ matrix.platform }} ${{ matrix.arch }})
        working-directory: ${{ inputs.app_dir }}
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          OUT_DIR: ${{ inputs.output_dir }}
          # Secrets opcionais de assinatura/notarização (vazios = desligado), só na plataforma certa:
          # o CSC_LINK (Apple) não pode chegar ao job do Windows, senão o electron-builder tentaria
          # assinar o .exe com ele. APPLE_API_KEY (caminho do .p8) é criado no passo "Assinatura".
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_API_KEY_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'mac' && secrets.APPLE_API_ISSUER || '' }}
          WIN_CSC_LINK: ${{ matrix.platform == 'win' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          AZURE_TENANT_ID: ${{ matrix.platform == 'win' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ matrix.platform == 'win' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ matrix.platform == 'win' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ matrix.platform == 'win' && secrets.AZURE_TRUSTED_SIGNING_ENDPOINT || '' }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ matrix.platform == 'win' && secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME || '' }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ matrix.platform == 'win' && secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE || '' }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ matrix.platform == 'win' && secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME || '' }}
        run: |
          set -euo pipefail
          # Secret ausente chega como variável VAZIA; o electron-builder trata CSC_LINK="" como caminho
          # (a pasta atual) e quebra no Mac com "not a file". Vazia = não definida.
          for v in CSC_LINK CSC_KEY_PASSWORD CSC_NAME WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            [[ -n "${!v:-}" ]] || unset "$v"
          done
          # Windows no contêiner com Wine: o HOME (/github/home) não pertence ao usuário do contêiner e
          # o Wine se recusa a criar a configuração lá; usa um prefixo próprio.
          # Além disso, o Wine traduz o caminho para o formato do Windows, que ignora o ponto no fim do
          # nome da pasta ("piu."): o build do Windows roda numa cópia em /tmp/src e devolve o resultado.
          if [[ "$PLATFORM" == win ]]; then
            export WINEPREFIX=/tmp/wineprefix; mkdir -p "$WINEPREFIX"
            rm -rf /tmp/src && cp -a "$GITHUB_WORKSPACE" /tmp/src
            here="$PWD"; cd "/tmp/src/$APP_DIR"
            trap 'mkdir -p "$here/${OUT_DIR:-release}"; cp -a "/tmp/src/$APP_DIR/${OUT_DIR:-release}/." "$here/${OUT_DIR:-release}/" 2>/dev/null || true' EXIT
          fi
          # Usa o script dist:<so> do app quando existir (ele já monta painel + processo principal);
          # senão, build genérico + electron-builder direto.
          if node -e "process.exit(require('./package.json').scripts?.['dist:'+process.env.PLATFORM] ? 0 : 1)"; then
            npm run "dist:${PLATFORM}" -- "--${ARCH}" --publish never
          else
            npm run build --if-present
            npx electron-builder "--${PLATFORM}" "--${ARCH}" --publish never
          fi

      - name: Coletar instaladores
        id: collect
        working-directory: ${{ inputs.app_dir }}
        env:
          OUT_DIR: ${{ inputs.output_dir }}
        run: |
          set -euo pipefail
          out="${OUT_DIR:-release}"
          mkdir -p ../../_installers
          shopt -s nullglob
          files=( "$out"/*.dmg "$out"/*.zip "$out"/*.AppImage "$out"/*.deb "$out"/*.exe )
          if [[ ${#files[@]} -eq 0 ]]; then echo "::error::Nenhum instalador em $out"; ls -la "$out" || true; exit 1; fi
          for f in "${files[@]}"; do cp "$f" ../../_installers/; done
          ls -la ../../_installers

      - name: SHA-256 (por plataforma)
        working-directory: _installers
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null; then sha256sum -- * > "SHA256SUMS-${{ matrix.label }}.txt"; else shasum -a 256 -- * > "SHA256SUMS-${{ matrix.label }}.txt"; fi
          cat "SHA256SUMS-${{ matrix.label }}.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_prefix }}-${{ steps.ver.outputs.version }}-${{ matrix.label }}
          path: _installers/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release em rascunho (${{ inputs.tag }})
    if: inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # criar o release em rascunho
      actions: read     # baixar os artefatos deste run com `gh run download`
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Baixar artefatos do run (gh, sem action de terceiros)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --dir _dl_raw
          mkdir -p _dl
          find _dl_raw -type f ! -name 'SHA256SUMS-*.txt' -exec mv -t _dl/ {} +
          ls -la _dl

      - name: SHA256SUMS.txt (consolidado)
        working-directory: _dl
        run: |
          set -euo pipefail
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Criar/atualizar release em RASCUNHO
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.app_name }} ${{ inputs.version }}
          APP_DIR: ${{ inputs.app_dir }}
          MAC_SIGNED: ${{ secrets.CSC_LINK != '' }}
          MAC_NOTARIZED: ${{ secrets.APPLE_API_KEY_P8 != '' || secrets.APPLE_ID != '' }}
          WIN_SIGNED: ${{ secrets.WIN_CSC_LINK != '' }}
        run: |
          set -euo pipefail
          # Texto conforme os secrets: sem eles, as instruções de "abrir mesmo assim" continuam.
          if [[ "$MAC_SIGNED" == true && "$MAC_NOTARIZED" == true ]]; then
            mac="- macOS: assinado com Developer ID e notarizado pela Apple."
          else
            mac="- macOS: sem notarização. Na primeira abertura, botão direito no app → Abrir."
          fi
          if [[ "$WIN_SIGNED" == true ]]; then
            win="- Windows: instalador assinado (o SmartScreen pode avisar até o certificado ganhar reputação)."
          else
            win="- Windows: sem assinatura. O SmartScreen avisa; \"Mais informações\" → \"Executar assim mesmo\"."
          fi
          notes="Instaladores de ${APP_DIR} (${TAG}).

          ${mac}
          ${win}
          - Linux: \`chmod +x\` no AppImage, ou \`sudo apt install ./*.deb\`.

          Confira o SHA-256 em \`SHA256SUMS.txt\`."
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release já publicado não é sobrescrito: quem baixa e a assinatura GPG ficariam inconsistentes.
            if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != true ]]; then
              echo "::error::O release $TAG já foi publicado; não vou sobrescrever. Use outra tag/versão."; exit 1
            fi
            echo "Release $TAG é rascunho: enviando arquivos (--clobber)"
            gh release upload "$TAG" _dl/* --clobber
          else
            gh release create "$TAG" _dl/* --draft --verify-tag --title "$TITLE" --notes "$notes"
          fi
          echo "::notice::Release em rascunho criado/atualizado: $TAG (publicar manualmente)"
