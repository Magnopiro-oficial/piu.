name: CI · desktop

on:
  push:
    branches: [main]
    paths: ['apps/desktop/**', 'apps/mobile/src/**', 'apps/mobile/package*.json', 'apps/piu-node/src/**', 'apps/piu-node/package*.json', '.github/workflows/desktop-ci.yml']
  pull_request:
    paths: ['apps/desktop/**', 'apps/mobile/src/**', 'apps/mobile/package*.json', 'apps/piu-node/src/**', 'apps/piu-node/package*.json', '.github/workflows/desktop-ci.yml']

permissions:
  contents: read

concurrency:
  group: ci-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Dependências (núcleos compartilhados e desktop)
        run: npm run deps && npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Testes (LAN, vínculo QR e estado local)
        run: npm test
      - name: Build
        run: npm run build
