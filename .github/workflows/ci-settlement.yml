name: CI · liquidação

on:
  push:
    branches: [main]
    paths: ['apps/settlement/**', 'apps/mobile/src/protocol/**', '.github/workflows/ci-settlement.yml']
  pull_request:
    paths: ['apps/settlement/**', 'apps/mobile/src/protocol/**', '.github/workflows/ci-settlement.yml']

# Menor privilégio: o token do GitHub só lê o código.
permissions:
  contents: read

concurrency:
  group: ci-settlement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: liquidação
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/settlement
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/settlement/package-lock.json
      - run: npm ci
      - name: Auditoria de dependências (falha em alto/crítico)
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Testes
        run: npm test
      - name: Plano do lote de exemplo (sem rede)
        run: npm run lot:plan -- examples/lote-exemplo.json
      - name: Ciclo do validador com dados de exemplo (sem rede)
        run: |
          npm run validator:demo -- /tmp/dados
          npm run validator:close -- --dir /tmp/dados --epoch 2026-S40 --budget 1000 --now 2026-10-13T00:00:00Z
          npm run validator:close -- --dir /tmp/dados --epoch 2026-S41 --budget 1000 --now 2026-10-20T00:00:00Z
          npm run lot:plan -- /tmp/dados/lotes/piu-lote-2026-S41.json
