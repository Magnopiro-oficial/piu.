name: CI · piu-node

on:
  push:
    branches: [main]
    paths: ['apps/piu-node/**', '.github/workflows/ci-piu-node.yml']
  pull_request:
    paths: ['apps/piu-node/**', '.github/workflows/ci-piu-node.yml']

# Menor privilégio: o token do GitHub só lê o código.
permissions:
  contents: read

concurrency:
  group: ci-piu-node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: piu-node (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.19: mínimo das bibliotecas e o Node do OpenWrt 24.10 (20.20); 22: o do OpenWrt 25.12 e do CI.
        node: ['20.19', '22']
    defaults:
      run:
        working-directory: apps/piu-node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: apps/piu-node/package-lock.json
      - run: npm ci
      - name: Auditoria de dependências (falha em alto/crítico)
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Testes de segurança
        run: npm test
      - name: Build
        run: npm run build
