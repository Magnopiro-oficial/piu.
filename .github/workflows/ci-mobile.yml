name: CI · App mobile

on:
  push:
    branches: [main]
    paths: ['apps/mobile/**', '.github/workflows/ci-mobile.yml']
  pull_request:
    paths: ['apps/mobile/**', '.github/workflows/ci-mobile.yml']

# Menor privilégio: o token do GitHub só lê o código (nada de escrita no repositório).
permissions:
  contents: read

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: App mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - name: Auditoria de dependências (falha em alto/crítico)
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Testes do protocolo (criptografia e roteamento)
        run: npm test
      - name: Build web (confere o bundle)
        run: npm run export:web
