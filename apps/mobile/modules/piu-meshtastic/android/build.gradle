plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'net.piu'
version = '0.1.0'

android {
  namespace "expo.modules.piumeshtastic"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.13.1'
  // Testes JVM das partes puras (fila GATT, drenagem do FromRadio).
  testImplementation 'junit:junit:4.13.2'
}
