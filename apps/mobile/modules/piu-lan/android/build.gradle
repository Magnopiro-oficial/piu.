plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'net.piu'
version = '0.1.0'

android {
  namespace "expo.modules.piulan"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // bundleOf (o expo-modules-core já traz uma versão maior; o Gradle usa a maior).
  implementation 'androidx.core:core-ktx:1.13.1'
}
