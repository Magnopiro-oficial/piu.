plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'net.piu'
version = '0.1.0'

android {
  namespace "expo.modules.piunodelink"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // A mesma versão que o React Native já traz (node_modules/react-native/gradle/libs.versions.toml).
  implementation 'com.squareup.okhttp3:okhttp:4.9.2'
}
