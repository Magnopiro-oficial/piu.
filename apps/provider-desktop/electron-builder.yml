# appId (identificador do app no macOS e no Linux): decisão da Lunes, como os identificadores das lojas.
# Sem ele, o electron-builder usa um padrão; defina antes de distribuir.
productName: Piu Provider
copyright: Lunes Network · AGPL-3.0-only
directories:
  output: release
  buildResources: assets
files:
  - dist/main.cjs
  - package.json
extraResources:
  - from: ../provider-panel/dist
    to: panel
  - from: assets
    to: assets
    filter: ["tray*.png", "icon.png"]
# Nome dos instaladores com SO + arquitetura, para os .dmg x64 e arm64 não colidirem no mesmo
# release (ex.: "Piu Provider-0.1.0-mac-arm64.dmg", "Piu Provider-0.1.0-win-x64.exe").
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
asar: true
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
linux:
  target: [AppImage, deb]
  category: Network
  icon: assets/icon.png
  maintainer: Lunes Network
  synopsis: Painel e nó do provider da rede Piu
  description: Transforma este computador num nó do Piu e mostra o painel do provider. Funciona sem internet.
mac:
  target: [dmg, zip]
  category: public.app-category.utilities
  icon: assets/icon.png
  # Sem assinatura nem notarização por enquanto (testes locais). Ver o README.
  identity: null
  hardenedRuntime: true
dmg:
  title: Piu Provider
win:
  # NSIS x64. Sem assinatura (sem certificado): o SmartScreen avisa na instalação.
  # O ícone .ico é gerado pelo electron-builder a partir do PNG 1024x1024.
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.png
  # Sem espaço no nome: o Wine (build do Windows no Linux) falha com o caminho "Piu Provider-…".
  artifactName: Piu-Provider-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  shortcutName: Piu Provider
