# appId (identificador do app no macOS e no Linux): decisão da Lunes, como os identificadores das lojas.
# Sem ele, o electron-builder usa um padrão; defina antes de distribuir.
productName: Piu Provider
copyright: Lunes Network · AGPL-3.0-only
directories:
  output: release
  buildResources: assets
files:
  - dist/main.cjs
  - package.json
extraResources:
  - from: ../provider-panel/dist
    to: panel
  - from: assets
    to: assets
    filter: ["tray*.png", "icon.png"]
asar: true
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
linux:
  target: [AppImage, deb]
  category: Network
  icon: assets/icon.png
  maintainer: Lunes Network
  synopsis: Painel e nó do provider da rede Piu
  description: Transforma este computador num nó do Piu e mostra o painel do provider. Funciona sem internet.
mac:
  target: [dmg, zip]
  category: public.app-category.utilities
  icon: assets/icon.png
  # Sem assinatura nem notarização por enquanto (testes locais). Ver o README.
  identity: null
  hardenedRuntime: true
dmg:
  title: Piu Provider
