# Assinatura de código condicional (YAML não tem `if`): o .cjs devolve só os blocos mac/win de
# assinatura conforme o ambiente; tudo o que está aqui tem prioridade sobre ele.
# Ver docs/distribuicao/assinatura.md.
extends: ./electron-builder.signing.cjs
# appId (identificador do app no macOS e no Linux): decisão da Lunes, como os identificadores das lojas.
# Sem ele, o electron-builder usa um padrão; defina antes de distribuir.
productName: Piu Provider
copyright: Lunes Network · AGPL-3.0-only
directories:
  output: release
  buildResources: assets
files:
  - dist/main.cjs
  - package.json
extraResources:
  - from: ../provider-panel/dist
    to: panel
  - from: assets
    to: assets
    filter: ["tray*.png", "icon.png"]
# Nome dos instaladores com SO + arquitetura, para os .dmg x64 e arm64 não colidirem no mesmo
# release (ex.: "Piu-Provider-0.1.0-mac-arm64.dmg"). Sem espaço: o GitHub troca espaço por ponto
# nos arquivos do release e o SHA256SUMS.txt deixaria de bater com o que a pessoa baixa.
artifactName: Piu-Provider-${version}-${os}-${arch}.${ext}
asar: true
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # file:// sem privilégios extras: a janela nunca carrega file:// (defesa em profundidade, auditoria 2026-11-06 B-04).
  grantFileProtocolExtraPrivileges: false
linux:
  target: [AppImage, deb]
  category: Network
  icon: assets/icon.png
  maintainer: Lunes Network
  synopsis: Painel e nó do provider da rede Piu
  description: Transforma este computador num nó do Piu e mostra o painel do provider. Funciona sem internet.
mac:
  target: [dmg, zip]
  category: public.app-category.utilities
  icon: assets/icon.png
  # Assinatura (identity, hardenedRuntime, entitlements, notarize): vem do electron-builder.signing.cjs
  # (`extends` no topo). Sem certificado continua ad-hoc ("-"), sem hardened runtime, como antes.
  extendInfo:
    # macOS 15+ pede permissão de rede local (o nó LNNP anuncia e conversa na LAN); o texto vem daqui.
    NSLocalNetworkUsageDescription: O Piu Provider conversa com aparelhos na mesma rede para retransmitir mensagens.
dmg:
  title: Piu Provider
win:
  # NSIS x64. Assinatura: WIN_CSC_LINK (.pfx) ou Azure Trusted Signing, pelo
  # electron-builder.signing.cjs. Sem nenhum dos dois, sai sem assinatura (o SmartScreen avisa).
  # O ícone .ico é gerado pelo electron-builder a partir do PNG 1024x1024.
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.png
  # Sem espaço no nome: o Wine (build do Windows no Linux) falha com o caminho "Piu Provider-…".
  artifactName: Piu-Provider-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  shortcutName: Piu Provider
